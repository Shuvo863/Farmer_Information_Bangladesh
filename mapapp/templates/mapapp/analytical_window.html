<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytical Window</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Noto Sans Bengali', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #2c3e50;
            color: white;
            padding: 15px 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: nowrap;
            align-items: flex-end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            min-width: 120px;
            max-width: 150px;
            flex: 1;
        }

        .filter-group label {
            font-size: 12px;
            margin-bottom: 5px;
            color: #ecf0f1;
        }

        .filter-group select,
        .filter-group input[type="text"],
        .filter-group input {
            height: 42px;
            padding: 8px 12px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            width: 100%;
            transition: all 0.2s;
        }

        .land-amount-group {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            min-width: 250px;
            max-width: 300px;
            flex: 0 0 auto;
        }

        .land-amount-group label {
            margin-bottom: 0;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .land-amount-group input {
            height: 42px;
            padding: 8px 12px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            flex: 1;
            min-width: 150px;
        }

        .clear-filters-btn {
            height: 42px;
            padding: 0 15px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .clear-filters-btn:hover {
            background-color: #c0392b;
            transform: translateY(-1px);
        }

        .btn-search {
            height: 42px;
            padding: 0 20px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-search:hover {
            background: #229954;
            transform: translateY(-1px);
        }

        .main-content {
            display: flex;
            flex: 1;
            justify-content: center;
            align-items: center;
            background-color: #f0f2f5;
            color: #7f8c8d;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="header">
        <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 15px;">
            <button id="back-btn" style="
                background: none; 
                border: none; 
                color: white; 
                font-size: 24px; 
                cursor: pointer; 
                display: flex; 
                align-items: center; 
                justify-content: center;
                padding: 5px;
                border-radius: 50%;
                transition: background 0.2s;
            ">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>
            <h1 style="margin-bottom: 0;">Analytical Window</h1>
        </div>
        <div class="filters">
            <div class="filter-group">
                <label for="division-select">বিভাগ:</label>
                <select id="division-select">
                    <option value="">সব বিভাগ</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="district-select">জেলা:</label>
                <select id="district-select" disabled>
                    <option value="">জেলা নির্বাচন করুন</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="upazila-select">উপজেলা:</label>
                <select id="upazila-select" disabled>
                    <option value="">উপজেলা নির্বাচন করুন</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="class-select">শ্রেণী:</label>
                <select id="class-select">
                    <option value="">সব শ্রেণী</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="gender-select">কৃষকের জেন্ডার:</label>
                <select id="gender-select">
                    <option value="">সব</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="education-select">শিক্ষাগত যোগ্যতা:</label>
                <select id="education-select">
                    <option value="">সব</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="smartphone-select">স্মার্ট ফোন ব্যবহারকারী:</label>
                <select id="smartphone-select">
                    <option value="">সব</option>
                    <option value="হ্যাঁ">হ্যাঁ</option>
                    <option value="না">না</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="search-input">অনুসন্ধান:</label>
                <input type="text" id="search-input" placeholder="নাম/উপজেলা/জেলা/গ্রাম">
            </div>
            <div class="filter-group land-amount-group">
                <label for="land-amount-input">মোট জমির পরিমাণ:</label>
                <input type="number" id="land-amount-input" placeholder="জমির পরিমাণ" step="0.01" min="0">
            </div>
            <div class="filter-group">
                <label for="land-operator-select">জমির তুলনা:</label>
                <select id="land-operator-select">
                    <option value="">নির্বাচন করুন</option>
                    <option value="greater">এর চেয়ে বেশি</option>
                    <option value="equal">সমান</option>
                    <option value="less">এর চেয়ে কম</option>
                </select>
            </div>
            <div class="filter-group" style="min-width: auto; max-width: none; flex: 0 0 auto;">
                <label style="opacity: 0;">&nbsp;</label>
                <button class="btn-search" id="search-btn">অনুসন্ধান</button>
            </div>
            <div class="filter-group" style="min-width: auto; max-width: none; flex: 0 0 auto;">
                <label style="opacity: 0;">&nbsp;</label>
                <button class="clear-filters-btn" id="clear-filters-btn" title="সব ফিল্টার সাফ করুন">
                    <span>↻</span> সব ফিল্টার সাফ করুন
                </button>
            </div>
            <div class="filter-group" style="min-width: auto; max-width: none; flex: 0 0 auto;">
                <label style="opacity: 0;">&nbsp;</label>
                <button class="btn-search" id="go-analysis-btn" style="background: #8e44ad;">
                    Go Analysis
                </button>
            </div>
        </div>
    </div>
    <div class="main-content">
        <!-- Content will be added later -->
        <div>Analytical Data will appear here</div>
    </div>

    <script>
        async function loadFilterOptions() {
            try {
                const response = await fetch('/api/filter-options/');
                const data = await response.json();
                refreshDynamicFilters(data.education, data.classes);
            } catch (error) {
                console.error('Error loading filter options:', error);
            }
        }

        async function loadDivisions() {
            try {
                const response = await fetch('/api/divisions/');
                const data = await response.json();
                const select = document.getElementById('division-select');
                select.innerHTML = '<option value="">সব বিভাগ</option>';
                data.divisions.forEach(div => {
                    const option = document.createElement('option');
                    option.value = div.name_en;
                    option.textContent = div.name_bn || div.name_en;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading divisions:', error);
            }
        }

        async function loadDistricts(divisionName) {
            const select = document.getElementById('district-select');
            select.innerHTML = '<option value="">জেলা নির্বাচন করুন</option>';
            select.disabled = !divisionName;
            if (!divisionName) return;

            try {
                const response = await fetch(`/api/districts/?division=${encodeURIComponent(divisionName)}`);
                const data = await response.json();
                data.districts.forEach(dist => {
                    const option = document.createElement('option');
                    option.value = dist.name_en;
                    option.textContent = dist.name_bn || dist.name_en;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading districts:', error);
            }
        }

        async function loadUpazilas(districtName) {
            const select = document.getElementById('upazila-select');
            select.innerHTML = '<option value="">উপজেলা নির্বাচন করুন</option>';
            select.disabled = !districtName;
            if (!districtName) return;

            try {
                const response = await fetch(`/api/upazilas/?district=${encodeURIComponent(districtName)}`);
                const data = await response.json();
                data.upazilas.forEach(upz => {
                    const option = document.createElement('option');
                    option.value = upz.name_en;
                    option.textContent = upz.name_bn || upz.name_en;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading upazilas:', error);
            }
        }

        function refreshDynamicFilters(educationOptions, classOptions) {
            const eduSelect = document.getElementById('education-select');
            const classSelect = document.getElementById('class-select');
            const currentEdu = eduSelect.value;
            const currentClass = classSelect.value;

            eduSelect.innerHTML = '<option value="">সব</option>';
            educationOptions.forEach(opt => {
                const option = document.createElement('option');
                option.value = opt;
                option.textContent = opt;
                eduSelect.appendChild(option);
            });
            if (currentEdu) eduSelect.value = currentEdu;

            classSelect.innerHTML = '<option value="">সব শ্রেণী</option>';
            classOptions.forEach(opt => {
                const option = document.createElement('option');
                option.value = opt;
                option.textContent = opt;
                classSelect.appendChild(option);
            });
            if (currentClass) classSelect.value = currentClass;
        }

        // Initialize and Parse URL
        async function init() {
            // Load base data
            await loadFilterOptions();
            await loadDivisions();

            // Parse URL params
            const params = new URLSearchParams(window.location.search);
            const division = params.get('division');
            const district = params.get('district');
            const upazila = params.get('upazila');
            const education = params.get('education');
            const className = params.get('class');
            const gender = params.get('gender');
            const smartphone = params.get('smart_phone');
            const search = params.get('search');
            const landOp = params.get('land_operator');
            const landAmt = params.get('land_amount');

            // Apply filters sequentially
            if (division) {
                document.getElementById('division-select').value = division;
                await loadDistricts(division);

                if (district) {
                    document.getElementById('district-select').value = district;
                    await loadUpazilas(district);

                    if (upazila) {
                        document.getElementById('upazila-select').value = upazila;
                    }
                }
            }

            if (education) document.getElementById('education-select').value = education;
            if (className) document.getElementById('class-select').value = className;
            if (gender) document.getElementById('gender-select').value = gender;
            if (smartphone) document.getElementById('smartphone-select').value = smartphone;
            if (search) document.getElementById('search-input').value = search;
            if (landOp) document.getElementById('land-operator-select').value = landOp;
            if (landAmt) document.getElementById('land-amount-input').value = landAmt;
        }

        // Event Listeners for cascading (keeping UI consistent if user changes filters here)
        document.getElementById('division-select').addEventListener('change', async function (e) {
            document.getElementById('district-select').value = '';
            document.getElementById('upazila-select').value = '';
            await loadDistricts(e.target.value);
        });

        document.getElementById('district-select').addEventListener('change', async function (e) {
            document.getElementById('upazila-select').value = '';
            await loadUpazilas(e.target.value);
        });

        // Back Button Logic
        document.getElementById('back-btn').addEventListener('click', () => {
            const params = new URLSearchParams(window.location.search);
            // Preserve all current params to return to dashboard state
            const url = `/?${params.toString()}`;
            window.location.href = url;
        });

        // Copy Go Analysis Button Logic to allow opening *another* analysis window recursively, or just keep it active.
        document.getElementById('go-analysis-btn').addEventListener('click', () => {
            const params = new URLSearchParams();

            const division = document.getElementById('division-select').value;
            const district = document.getElementById('district-select').value;
            const upazila = document.getElementById('upazila-select').value;
            const education = document.getElementById('education-select').value;
            const className = document.getElementById('class-select').value;
            const gender = document.getElementById('gender-select').value;
            const smartphone = document.getElementById('smartphone-select').value;
            const search = document.getElementById('search-input').value;
            const landOp = document.getElementById('land-operator-select').value;
            const landAmt = document.getElementById('land-amount-input').value;

            if (division) params.append('division', division);
            if (district) params.append('district', district);
            if (upazila) params.append('upazila', upazila);
            if (education) params.append('education', education);
            if (className) params.append('class', className);
            if (gender) params.append('gender', gender);
            if (smartphone) params.append('smart_phone', smartphone);
            if (search) params.append('search', search);
            if (landOp) params.append('land_operator', landOp);
            if (landAmt) params.append('land_amount', landAmt);

            const url = `/analytics/?${params.toString()}`;
            // If they click "Go Analysis" AGAIN from here, maybe they want to reload with new filters?
            // Or maybe open a new one? Let's use same window for consistency.
            window.location.href = url;
        });

        // Run Init
        init();
    </script>
</body>

</html>
